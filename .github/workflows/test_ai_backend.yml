name: Test AI Backend

# ─────────────────────────────────────────────────────────────────────────────
# Manual-only workflow for testing an AI provider/model in isolation.
# Never runs on a schedule — trigger from Actions UI or `gh workflow run`.
#
# Runs source → engine ONLY (--engine-only skips every adapter, so nothing
# is ever posted to any public channel or emailed to anyone). Nothing is
# committed back to the repo either — this is purely a pass/fail check of
# "can this API key + base URL + model produce a valid haiku right now."
#
# Two modes:
#   1. Test one specific provider: set ai_key_secret (+ optional ai_base_url /
#      ai_model overrides) to force that single provider via CBS_AI_KEY.
#   2. Test the whole fallback chain for real: leave ai_key_secret blank —
#      every fallback secret below is passed through as-is, so config.yml's
#      ai.fallback list runs exactly as it would on the real daily run
#      (primary Groq key intentionally NOT set here, so it skips straight to
#      the fallback chain — set CBS_AI_KEY yourself via ai_key_secret if you
#      want to test the primary too).
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      ai_key_secret:
        description: 'Name of the repo secret to force as CBS_AI_KEY (blank = test the fallback chain instead)'
        required: false
        type: string
      ai_base_url:
        description: 'CBS_AI_BASE_URL override (blank = use config.yml default)'
        required: false
        type: string
      ai_model:
        description: 'CBS_AI_MODEL override (blank = use config.yml default)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test engine
        env:
          CBS_AI_KEY: ${{ inputs.ai_key_secret != '' && secrets[inputs.ai_key_secret] || '' }}
          CBS_AI_BASE_URL: ${{ inputs.ai_base_url }}
          CBS_AI_MODEL: ${{ inputs.ai_model }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python run.py --force --regenerate --engine-only
