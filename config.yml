# ─────────────────────────────────────────────────────────────────────────────
# ClamBakeSanta — Framework Configuration
#
# This file drives the entire system. No business logic is hardcoded.
# Swap engines, add adapters, change schedule — all from here.
# ─────────────────────────────────────────────────────────────────────────────

# ── Identity ──────────────────────────────────────────────────────────────────
site_title: "Clam Bake Santa"
site_base_url: "https://soylentaquamarine.github.io/ClamBakeSanta"
timezone: "America/New_York"

# ── Active source plugin ──────────────────────────────────────────────────────
# Produces the Event that drives each run.
# Swap to "manual_trigger" or "system_metrics" to change input behavior.
source: daily_themes

# ── Active engine plugin ──────────────────────────────────────────────────────
# Transforms the Event into a Result.
# Swap to a different engine to completely change what the system produces.
# The framework doesn't care — as long as it returns a Result.
engine: clambakesanta

# ── Active adapter plugins ────────────────────────────────────────────────────
# Each adapter publishes the Result independently.
# Comment out any adapter to disable it. Add new ones to extend output channels.
# Adapters that lack their required environment variables skip silently.
adapters:
  - mastodon        # Posts each haiku 1 minute apart. Requires MASTODON_INSTANCE_URL + MASTODON_ACCESS_TOKEN secrets
  - bluesky         # Posts each haiku 1 minute apart. Requires BLUESKY_HANDLE + BLUESKY_APP_PASSWORD secrets
  - tumblr          # Posts each haiku 1 minute apart. Requires TUMBLR_CONSUMER_KEY/SECRET + TUMBLR_OAUTH_TOKEN/SECRET
  - telegram        # Posts each haiku 1 minute apart. Requires TELEGRAM_BOT_TOKEN + TELEGRAM_CHANNEL secrets
  - email_list      # Processes SUBSCRIBE/UNSUBSCRIBE emails and sends daily haiku digest. Requires GMAIL_ADDRESS + GMAIL_APP_PASSWORD
  - wordpress       # Posts daily digest to WordPress.com. Requires WORDPRESS_TOKEN + WORDPRESS_BLOG_ID
  - github_pages    # Updates site AFTER all social posts complete

# ── AI engine settings ────────────────────────────────────────────────────────
ai:
  # Primary: Groq free tier — requires CBS_AI_KEY secret (a Groq API key from
  # https://console.groq.com/keys). Own per-key quota, not a shared pool.
  # GitHub Models (the old free backend) was fully retired 2026-07-30.
  # gpt-oss is a reasoning model — reasoning_effort is set to "low" in
  # plugins/engines/clambakesanta.py so it doesn't burn its whole token
  # budget on hidden chain-of-thought (it did, silently, at default effort).
  # Override CBS_AI_BASE_URL + CBS_AI_KEY env vars to swap the primary provider.
  model: openai/gpt-oss-20b

  # Fallback chain — tried in order, only if the provider before it exhausts
  # all retries for a theme without a valid haiku (or fails fast on a bad
  # key/model — see _is_permanent_failure in clambakesanta.py). Each entry's
  # key_env must be set as both a GitHub secret AND passed through as an env
  # var in .github/workflows/daily.yml. Missing/empty keys are skipped
  # automatically, so it's harmless to list a provider you haven't set up.
  #
  # Ordered by confidence: genuine no-credit-card free tiers with your own
  # (non-shared) quota first, promotional/one-time-credit and
  # needs-account-fixes providers last. OpenAI was tried and deliberately
  # removed (2026-08-09) — not worth funding just as a last-resort backstop
  # when Groq/Mistral/Cohere already cover it for free. Not wired: Cloudflare
  # Workers AI (different request/response shape, not OpenAI-compatible,
  # needs an account ID we don't have) and local Ollama (GitHub Actions
  # runners can't reach a home machine without a public tunnel, which would
  # make the daily run depend on that machine being on — not worth the
  # fragility here).
  #
  # Live-tested against real keys 2026-08-09 — status of each below.
  fallback:
    - name: mistral
      # WORKS once reasoning_effort stopped being sent (Mistral rejects
      # "low"/"medium" outright, only accepts "none" or "high" for models
      # that support it at all — omitted here since it's not a reasoning
      # model). No reasoning_effort key = none sent.
      base_url: https://api.mistral.ai/v1
      key_env: MISTRAL_API_KEY
      model: mistral-small-latest
    - name: cohere
      # WORKS once reasoning_effort stopped being sent (same issue as
      # Mistral — rejected "low"/"medium", wants "high" or none).
      base_url: https://api.cohere.ai/compatibility/v1
      key_env: COHERE_API_KEY
      model: command-r7b-12-2024
    - name: cerebras
      # llama3.1-8b and llama-3.3-70b both 404'd (2026-08-09) — both are
      # stale model names, not currently in Cerebras' catalog at all.
      # Confirmed current catalog (per their docs): gpt-oss-120b (production),
      # gemma-4-31b (preview), zai-glm-4.7 (preview, deprecates 2026-08-17).
      # gpt-oss-120b is a reasoning model like Groq's — reasoning_effort
      # keeps it from burning its token budget on hidden chain-of-thought.
      base_url: https://api.cerebras.ai/v1
      key_env: CEREBRAS_API_KEY
      model: gpt-oss-120b
      reasoning_effort: low
    - name: openrouter
      base_url: https://openrouter.ai/api/v1
      key_env: OPENROUTER_API_KEY
      model: google/gemma-4-31b-it:free
    - name: pollinations
      # 402 on authenticated requests with $0 "pollen" balance, but
      # Pollinations' own error explicitly says anonymous requests are NOT
      # affected — optional_key skips auth entirely and calls it anonymously.
      base_url: https://text.pollinations.ai/openai
      key_env: POLLINATIONS_API_KEY
      model: openai
      optional_key: true
    - name: gemini
      # Free tier returned quota limit:0 (2026-08-09) unless a billing
      # account is linked to the project — kept anyway, a no-cost skip if
      # the key's still capped, in case a quota reset fixes it later.
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      key_env: GEMINI_API_KEY
      model: gemini-2.0-flash
    - name: fireworks
      # llama-v3p1-8b-instruct 404'd (2026-08-09) — stale model id. Swapped
      # to llama-v3p3-70b-instruct, confirmed current in Fireworks' catalog.
      base_url: https://api.fireworks.ai/inference/v1
      key_env: FIREWORKS_API_KEY
      model: accounts/fireworks/models/llama-v3p3-70b-instruct
    - name: huggingface
      # 400 "not supported by any provider you have enabled" (2026-08-09) —
      # despite the error text, HF's router auto-selects across ALL
      # providers by default (no toggle/enabling needed, confirmed via their
      # docs) — the real problem was meta-llama/Llama-3.2-3B-Instruct isn't
      # hosted by any provider on the router. Llama-3.1-8B-Instruct is a much
      # more widely-mirrored model, used here instead.
      base_url: https://router.huggingface.co/v1
      key_env: HUGGINGFACE_API_KEY
      model: meta-llama/Llama-3.1-8B-Instruct

# ── Theme caps ────────────────────────────────────────────────────────────────
max_haikus_per_day:    6   # hard cap: holidays + birthdays + celestial combined
max_celestial_per_day: 4   # celestial backfill cap (even when schedule is empty)

# ── Fallback themes ───────────────────────────────────────────────────────────
# Used when every scheduled theme hits writer's block.
# One is chosen at random so the bot never goes silent.
fallback_themes:
  - "The Beauty of Each Day"
  - "Simple Joys"
  - "Nature's Wonder"
  - "A Moment of Peace"
  - "The Changing Seasons"
  - "Gratitude"
  - "Small Miracles"

# ── Paths ─────────────────────────────────────────────────────────────────────
data_dir: data          # Holiday/birthday .txt files
output_dir: docs        # GitHub Pages serves this directory
state_dir: state        # Run log and deduplication store

# ── Plugin modules ────────────────────────────────────────────────────────────
# Importing these modules causes @register() decorators to fire.
# Add a new plugin module path here to make it available.
plugin_modules:
  - plugins.sources.daily_holidays
  - plugins.sources.daily_themes
  - plugins.engines.clambakesanta
  - plugins.adapters.github_pages
  - plugins.adapters.mastodon_adapter
  - plugins.adapters.bluesky
  - plugins.adapters.tumblr
  - plugins.adapters.telegram
  - plugins.adapters.email_list
  - plugins.adapters.wordpress
